app:
  description: Chatflow with an Agent (Agentic Strategy) node wired to all 8 AgenticRAG MCP tools
  icon: 💬
  icon_background: '#FEF7C3'
  icon_type: emoji
  mode: advanced-chat
  name: Chatflow Basic (AgenticRAG Agent)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openrouter:0.1.9@8f8c69f645a62eb917ae219cfb8b567e39707941fc06c755d565ebea6cd1d88a
    version: null
# Agent strategy plugin (provides the FunctionCalling strategy used by the Agent node)
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/agent:0.0.50@bf1040682cc9e1e5caf9b4670531639c440bf9448025cd5ee0915fdcf7a921f3
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: Hi! I'm connected to the AgenticRAG MCP server — knowledge base (ask/search), live web (web_search/fetch_url — try "what time is it in Hong Kong" or "how to trace an O365 email"), and source management (list/add/sync/remove), plus status and graph_query.
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    # Start -> Agent
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: agent
      id: start-agent
      source: '1776072202913'
      sourceHandle: source
      target: agentic_strategy
      targetHandle: target
      type: custom
      zIndex: 0
    # Agent -> Answer
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: agent
        targetType: answer
      id: agent-answer
      source: agentic_strategy
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    # ---- Start node ----
    - data:
        desc: Capture user's chat messages and files.
        selected: false
        title: User Input
        type: start
        variables: []
      height: 117
      id: '1776072202913'
      position:
        x: 80
        y: 286
      positionAbsolute:
        x: 80
        y: 286
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    # ---- Agentic Strategy node: FunctionCalling agent with all 8 AgenticRAG tools ----
    # After import: if the strategy/model/tools did not auto-link, open this node,
    # select strategy "FunctionCalling" (langgenius/agent), model deepseek/deepseek-v4.1-flash
    # (openrouter), and attach the 8 tools from the "Agentic RAG" (agentic-rag) MCP provider.
    - data:
        agent_parameters:
          # NOTE: parameter names must match the strategy declaration exactly
          # (function_calling declares: model, allowed_tools, tools, instruction,
          # context, query, files, maximum_iterations)
          instruction:
            type: constant
            value: |
              You are a test assistant for the AgenticRAG MCP server. You have 8 tools
              from the "Agentic RAG" (provider id: agentic-rag) MCP provider:

              - ask: full agentic Q&A over the knowledge base; returns answer + citations
                (optional args: mode "auto|fast|deep", max_iterations)
              - search: raw vector search (args: query, limit)
              - web_search: LIVE web search via SearXNG (args: query, limit).
                Use it for current events, live data (time, weather, news),
                or anything the knowledge base can't contain. Note: search
                snippets are CACHED — never trust them for exact time/date.
              - fetch_url: fetch a live web page (args: url, max_chars).
                For current time/date questions: call fetch_url on any URL
                and use the returned `date_utc` header as the live UTC clock,
                then convert to the target timezone (e.g. Hong Kong = UTC+8,
                no DST). This is accurate; search snippets are not.
              - status: server health, decision layer, source health, index counters
              - sources_list: list registered sources with health
              - sources_add: register a source (type "local_folder" needs config.path;
                type "sqlite" needs config.db_path/table/template)
              - sources_sync: manual incremental sync (optional source_id)
              - sources_remove: remove a source by id (destructive — ask the user to
                confirm, and call sources_list first to get the source_id)
              - graph_query: optional graph search layer; if it returns FeatureDisabled,
                say so honestly instead of guessing

              Pick the tool that matches the request, call it, then summarize the result
              for the user. When a tool returns citations, list them. Never invent facts.

              PROBLEM-SOLVING LADDER (follow it, don't just announce it):
              1. Knowledge questions -> `ask` (the KB). If it says no relevant
                 information, do NOT stop there.
              2. Anything live, current, or outside the KB -> `web_search`.
                 For technical/admin questions, prefer authoritative domains
                 (learn.microsoft.com, docs sites) in the results.
              3. If a result looks authoritative and you need its full content,
                 call `fetch_url` on it. Use `date_utc` for any time/date math.
              4. Synthesize a concrete, actionable answer with source URLs.

              HARD RULES:
              - NEVER end your answer with stated intent ("let me check...") —
                either call the tool and give the result, or say you cannot.
              - Do not narrate your internal reasoning; output only the final answer.
          maximum_iterations:
            type: constant
            value: 10
          model:
            type: constant
            value:
              completion_params: {}
              mode: chat
              name: deepseek/deepseek-v4.1-flash
              provider: langgenius/openrouter/openrouter
          query:
            type: mixed
            value: '{{#sys.query#}}'
          tools:
            type: constant
            value:
            - enabled: true
              extra:
                description: Answer a question with agentic retrieval and per-source citations.
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: Answer a question with agentic retrieval and per-source citations.
              tool_label: ask
              tool_name: ask
              type: mcp
            - enabled: true
              extra:
                description: Direct vector search without synthesis.
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: Direct vector search without synthesis.
              tool_label: search
              tool_name: search
              type: mcp
            - enabled: true
              extra:
                description: Register a source. Types- local_folder, sqlite.
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: Register a source. Types- local_folder, sqlite.
              tool_label: sources_add
              tool_name: sources_add
              type: mcp
            - enabled: true
              extra:
                description: List sources with health and sync metadata.
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: List sources with health and sync metadata.
              tool_label: sources_list
              tool_name: sources_list
              type: mcp
            - enabled: true
              extra:
                description: Remove a source; drops documents whose last origin was this source.
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: Remove a source; drops documents whose last origin was this source.
              tool_label: sources_remove
              tool_name: sources_remove
              type: mcp
            - enabled: true
              extra:
                description: Manually trigger incremental sync.
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: Manually trigger incremental sync.
              tool_label: sources_sync
              tool_name: sources_sync
              type: mcp
            - enabled: true
              extra:
                description: 'Optional graph search (Graphify layer); disabled by default.'
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: 'Optional graph search (Graphify layer); disabled by default.'
              tool_label: graph_query
              tool_name: graph_query
              type: mcp
            - enabled: true
              extra:
                description: 'Server health: decision layer, per-source health, index counters.'
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: 'Server health: decision layer, per-source health, index counters.'
              tool_label: status
              tool_name: status
              type: mcp
            - enabled: true
              extra:
                description: Live web search via configured providers (SearXNG first; falls back to Tavily/Exa).
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: Live web search via configured providers (SearXNG first; falls back to Tavily/Exa).
              tool_label: web_search
              tool_name: web_search
              type: mcp
            - enabled: true
              extra:
                description: Fetch a live web page; response includes date_utc (live UTC clock) for accurate current time/date.
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: Fetch a live web page; response includes date_utc (live UTC clock) for accurate current time/date.
              tool_label: fetch_url
              tool_name: fetch_url
              type: mcp
        agent_strategy_label: FunctionCalling
        agent_strategy_name: function_calling
        agent_strategy_provider_name: langgenius/agent/agent
        # Required so the frontend resolves the installed plugin + allows MCP tools:
        # isSupportMCP(meta.version >= 0.0.2) gates every MCP tool in this node.
        meta:
          minimum_dify_version: '1.7.0'
          version: '0.0.2'
        plugin_unique_identifier: langgenius/agent:0.0.50@bf1040682cc9e1e5caf9b4670531639c440bf9448025cd5ee0915fdcf7a921f3
        desc: Agentic strategy node wired to all 8 AgenticRAG MCP tools.
        isInIteration: false
        isInLoop: false
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        selected: false
        title: Agentic Strategy
        tool_node_version: null
        type: agent
        version: '1'
      height: 148
      id: agentic_strategy
      position:
        x: 400
        y: 286
      positionAbsolute:
        x: 400
        y: 286
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    # ---- Answer node ----
    - data:
        answer: '{{#agentic_strategy.text#}}'
        desc: Return the agent's response to the user.
        selected: false
        title: Answer
        type: answer
        variables: []
      height: 147
      id: answer
      position:
        x: 720
        y: 286
      positionAbsolute:
        x: 720
        y: 286
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    viewport:
      x: -20
      y: -30
      zoom: 0.86
  rag_pipeline_variables: []
