              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: List sources with health and sync metadata.
              tool_label: sources_list
              tool_name: sources_list
              type: mcp
            - enabled: true
              extra:
                description: Remove a source; drops documents whose last origin was this source.
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: Remove a source; drops documents whose last origin was this source.
              tool_label: sources_remove
              tool_name: sources_remove
              type: mcp
            - enabled: true
              extra:
                description: Manually trigger incremental sync.
              parameters: {}
              provider_name: agentic-rag
              settings: {}
              tool_description: Manually trigger incremental sync.
              tool_label: sources_sync
              tool_name: sources_sync
              type: mcp
            - enabled: true
              extra:
                description: Optional graph search (Graphify layer); disabled by default.
              parameters: {}
