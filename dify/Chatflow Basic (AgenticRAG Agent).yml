      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: Hi! I'm connected to the AgenticRAG MCP server. Test me with — "what is the server status", "list my sources", "ask about quarterly revenue", "search for Apollo 11", "sync all sources", "add the fixtures folder as a source", "query the graph for X", or "remove a source".
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: agent
      id: start-agent
      source: '1776072202913'
      sourceHandle: source
      target: agentic_strategy
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: agent
        targetType: answer
      id: agent-answer
      source: agentic_strategy
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: Capture user's chat messages and files.
        selected: false
        title: User Input
        type: start
        variables: []
      height: 117
      id: '1776072202913'
      position:
        x: 80
        y: 286
      positionAbsolute:
        x: 80
        y: 286
      selected: false
      sourcePosition: right
      targetPosition: left
