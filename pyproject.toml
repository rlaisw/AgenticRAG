[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-mcp"
version = "0.1.0"
description = "Agentic RAG MCP server: incremental multi-source ingestion, vector + graph search, System1/System2 agentic answering over stdio MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.12,<2",
    "cocoindex[full]",
    "lancedb>=0.13",
    "sentence-transformers>=2.7",
    "langgraph>=0.2",
    "msal>=1.30",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
graphify = []
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
agentic-rag-mcp = "agentic_rag_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
